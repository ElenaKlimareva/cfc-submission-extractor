[project]
name = "cfc-submission-extractor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.1",
    "mistralai>=2.9.3",
    "pandas>=3.0.5",
    "pycountry>=26.2.16",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
    "seaborn>=0.13.2",
    "tenacity>=9.1.4",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jinja2>=3.1.6",
    "nbclient>=0.11.0",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.ruff]
line-length = 120

[tool.pyright]
include = ["src", "scripts", "tests"]
extraPaths = ["."]
pythonVersion = "3.13"
